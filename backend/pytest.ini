[pytest]
# Windows ProactorEventLoop 下必须把事件循环固定为 session 级，
# 否则每个测试新建 loop 会让 AsyncEngine 连接池里的连接挂在已关闭的 loop 上，
# 报 "Event loop is closed"。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
