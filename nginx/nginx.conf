# 完整 Nginx 主配置（挂载为 /etc/nginx/nginx.conf，不再使用 conf.d/*.conf）
# 关键点：worker_processes 固定为 1 —— 上游 keepalive 连接池是「每个 worker 各自一份」，
# 多 worker 会把连接池打散，洪峰时仍需新建大量连接，Windows 宿主会丢 SYN 导致 502。
worker_processes 1;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  75s;
    server_tokens   off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 限流区：按客户端 IP，100 r/s + 突发 300（整点 100 人同一秒涌入也不会被误杀）
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/s;
    limit_req_status 503;

    # 上游连接池：单 worker + keepalive 256，洪峰复用连接，避免新建连接丢 SYN
    upstream i2v_backend {
        server host.docker.internal:8000;
        keepalive 256;
        keepalive_requests 100000;
        keepalive_timeout 75s;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 15m;
        client_body_timeout 60s;

        # 后端 API：/api/ 与 /admin/ 转发 FastAPI
        # 管理端前端页面走 /console/*（SPA 回退），与 /admin/* API 物理隔离
        location /api/ {
            limit_req zone=api_zone burst=300 nodelay;
            proxy_pass http://i2v_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }

        location /admin/ {
            limit_req zone=api_zone burst=300 nodelay;
            proxy_pass http://i2v_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }

        location = /healthz {
            proxy_pass http://i2v_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 30s;
        }

        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
